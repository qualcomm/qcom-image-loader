name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          QIL version to release (e.g. 1.2.4). Updates MAJOR/MINOR/PATCH
          in src/Version.h.
        required: true
        type: string
      base_branch:
        description: 'Base branch to cut the release from'
        required: false
        type: string
        default: 'main'
      release_notes:
        description: 'Release notes (Markdown). Defaults to auto-generated notes.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft release (publish manually afterwards)'
        required: false
        type: boolean
        default: false

# ─────────────────────────────────────────────────────────────────────────────
# Shared helpers
# ─────────────────────────────────────────────────────────────────────────────
env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Validate inputs before doing any real work
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check actor is a maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          PERMISSION=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "Actor '${ACTOR}' permission: ${PERMISSION}"
          case "$PERMISSION" in
            admin|maintain|write)
              echo "✅ Authorized — proceeding with release."
              ;;
            *)
              echo "ERROR: Only maintainers (write/maintain/admin) may trigger this workflow."
              echo "Actor '${ACTOR}' has permission '${PERMISSION}'."
              exit 1
              ;;
          esac

      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$VERSION' does not match expected format X.X.X"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Create release branch, bump version, tag
  # ───────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare release v${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      # ── 1. Create release branch ──────────────────────────────────────────
      - name: Create release branch
        id: branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release-${VERSION}"

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "ERROR: Branch '${BRANCH}' already exists on remote."
            exit 1
          fi

          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── 2. Bump version in src/Version.h ────────────────────────────────────
      - name: Update src/Version.h
        env:
          VERSION: ${{ inputs.version }}
        run: |
          FILE="src/Version.h"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          sed -i "s/#define MAJOR_VERSION .*/#define MAJOR_VERSION ${MAJOR}/" "$FILE"
          sed -i "s/#define MINOR_VERSION .*/#define MINOR_VERSION ${MINOR}/" "$FILE"
          sed -i "s/#define PATCH_VERSION .*/#define PATCH_VERSION ${PATCH}/" "$FILE"

          echo "Updated $FILE:"
          cat "$FILE"

          grep -q "#define MAJOR_VERSION ${MAJOR}" "$FILE" && \
          grep -q "#define MINOR_VERSION ${MINOR}" "$FILE" && \
          grep -q "#define PATCH_VERSION ${PATCH}" "$FILE" || \
            { echo "ERROR: Version.h was not updated correctly"; exit 1; }

      # ── 3. Commit & push release branch ───────────────────────────────────
      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add src/Version.h
          git commit -m "Update QIL version to ${VERSION}"

      - name: Push release branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "$BRANCH"

      # ── 4. Create tag ─────────────────────────────────────────────────────
      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag '${TAG}' already exists on remote."
            exit 1
          fi

          git tag -a "$TAG" -m "QIL release v${VERSION}"
          git -c http.extraHeader="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Linux build
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (x64)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake libusb-1.0-0-dev libudev-dev uuid-dev pkg-config \
            zlib1g-dev build-essential libxml2-dev

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j"$(nproc)"

      - name: Package release artifact
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DIR_NAME="qil_${VERSION}_linux_x64"
          ARCHIVE="${DIR_NAME}.tar.gz"
          BIN_DIR="Build/Linux/$(uname -m)/Release/bin"

          if [ ! -f "${BIN_DIR}/qil" ]; then
            echo "ERROR: Expected binary not found at ${BIN_DIR}/qil"
            find Build -type f || true
            exit 1
          fi

          mkdir -p "release_staging/${DIR_NAME}"
          cp "${BIN_DIR}/qil"    "release_staging/${DIR_NAME}/"
          cp "RELEASE_NOTES.md"  "release_staging/${DIR_NAME}/"
          cp "README.md"         "release_staging/${DIR_NAME}/"

          (cd release_staging && tar -czf "../${ARCHIVE}" "${DIR_NAME}/")

          echo "artifact=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Release archive contents:"
          tar -tzf "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Windows build (x64 + ARM64, cross-compiled via MSVC v142 on an x64 host)
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: prepare
    runs-on: windows-2019
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Configure and build
        shell: cmd
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir build
          cd build
          cmake .. -A %ARCH%
          cmake --build . --config Release

      - name: Package release artifact
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          ARCH_LOWER=$(echo "$ARCH" | tr '[:upper:]' '[:lower:]')
          DIR_NAME="qil_${VERSION}_windows_${ARCH_LOWER}"
          ZIP_NAME="${DIR_NAME}.zip"
          BIN_DIR="Build/Windows/${ARCH}/Release/bin"

          if [ ! -f "${BIN_DIR}/qil.exe" ]; then
            echo "ERROR: Expected binary not found at ${BIN_DIR}/qil.exe"
            find Build -type f || true
            exit 1
          fi

          mkdir -p "release_staging/${DIR_NAME}"
          cp "${BIN_DIR}/qil.exe" "release_staging/${DIR_NAME}/"
          cp "RELEASE_NOTES.md"    "release_staging/${DIR_NAME}/"
          cp "README.md"          "release_staging/${DIR_NAME}/"

          (cd release_staging && 7z a "../${ZIP_NAME}" "${DIR_NAME}/")

          echo "artifact=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Publish GitHub release with both artifacts attached
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub release
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-linux.outputs.artifact }}

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qil_${{ inputs.version }}_windows_x64.zip

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qil_${{ inputs.version }}_windows_arm64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IS_DRAFT: ${{ inputs.draft }}
          LINUX_ARTIFACT: ${{ needs.build-linux.outputs.artifact }}
          WINDOWS_X64_ARTIFACT: qil_${{ inputs.version }}_windows_x64.zip
          WINDOWS_ARM64_ARTIFACT: qil_${{ inputs.version }}_windows_arm64.zip
        run: |
          NOTES="$RELEASE_NOTES"

          if [ -z "$NOTES" ]; then
            NOTES="## QIL release v${VERSION}

          Built from branch \`${BRANCH}\`."
          fi

          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          gh release create "$TAG" \
            "$LINUX_ARTIFACT" \
            "$WINDOWS_X64_ARTIFACT" \
            "$WINDOWS_ARM64_ARTIFACT" \
            --title "$TAG" \
            --notes "$NOTES" \
            $DRAFT_FLAG

          echo "✅ QIL release created: $TAG"
